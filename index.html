<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Una carta para ti</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💌%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
</head>
<body>
  <div id="defs" aria-hidden="true"></div>
  <!-- ============ CUARTO ============ -->
  <main id="scene" aria-hidden="true">
    <div class="wall" id="wall" aria-hidden="true"></div>

    <div class="winwrap" id="win" aria-hidden="true">
      <div class="winview">
        <div class="layer sun" data-d="6">
          <div class="rays"></div>
          <div class="disc"></div>
        </div>
        <div class="layer clouds" data-d="10">
          <i style="left:6%;top:16%;width:260px;height:70px"></i>
          <i style="left:52%;top:8%;width:320px;height:80px;animation-duration:110s"></i>
          <i style="left:28%;top:30%;width:220px;height:56px;animation-duration:95s"></i>
        </div>
        <div class="layer pollen" id="pollen"></div>
        <div class="layer hills" data-d="14">
          <svg viewBox="0 0 1440 400" preserveAspectRatio="none" aria-hidden="true">
            <path d="M0 220C200 140 380 180 560 210S960 120 1160 170S1380 190 1440 150V400H0Z" fill="#e8b4c4"
              opacity=".6" />
            <path d="M0 280C220 210 420 270 640 250S1040 190 1240 240S1400 250 1440 230V400H0Z" fill="#c6b0d2"
              opacity=".65" />
            <path d="M0 330C260 290 480 340 720 320S1120 280 1440 320V400H0Z" fill="#9fc29a" opacity=".9" />
          </svg>
        </div>
        <div class="layer" data-d="26">
          <div class="garden" id="garden"></div>
        </div>
        <div class="layer fireflies" id="fireflies"></div>
      </div>
      <div class="winframe"></div>
    </div>

    <div class="rod" aria-hidden="true"></div>
    <div class="curtain l" aria-hidden="true"><i></i><b></b></div>
    <div class="curtain r" aria-hidden="true"><i></i><b></b></div>
    <div id="vines" aria-hidden="true"></div>
    <div class="sill" aria-hidden="true"></div>
    <div class="sill-items" id="sillItems" aria-hidden="true"></div>

    <div class="scroller" id="scroller">
      <div class="stage">
        <aside class="player" id="player">
          <div class="pblock" id="cassBlock">
            <div class="kicker" id="kicker"></div>
            <h1 id="titulo"></h1>
            <div class="cass-wrap" id="cassWrap">
              <div id="cassBox"></div>
            </div>
          </div>
          <div class="pblock" id="restBlock">
            <div class="embed-box"><span>Cargando la playlist…</span>
              <div id="embed"></div>
            </div>
            <section class="liner" id="liner" aria-labelledby="linerTitle">
              <h2 class="label" id="linerTitle">Nota del casete</h2>
            </section>
          </div>
        </aside>

        <article class="paper" id="paper">
          <i class="washi w1" aria-hidden="true"></i><i class="washi w2" aria-hidden="true"></i>
          <div class="corner" id="corner" aria-hidden="true"></div>
          <p class="to" id="to"></p>
          <div class="body" id="paras"></div>
          <footer class="sig" id="sig"><span id="sigText"></span>
            <svg viewBox="0 0 38 34" aria-hidden="true">
              <path pathLength="1" d="M19 31C6 21 2 14 5 8C8 3 15 3 19 10C23 3 30 3 33 8C36 14 32 21 19 31Z" />
            </svg>
          </footer>
          <section id="ask" aria-labelledby="q">
            <div class="ask-heart" aria-hidden="true">♥</div>
            <h2 id="q"></h2>
            <p class="sub" id="sq"></p>
            <div class="btns" id="btns">
              <button class="btn yes" id="yes"></button>
              <button class="btn no" id="no"></button>
            </div>
            <p id="noMsg"></p>
          </section>
          <button class="skip" id="skip">Mostrar toda la carta</button>
        </article>
      </div>
    </div>
    <div id="fx" aria-hidden="true"></div>

    <button class="more" id="more" aria-label="Hay más aquí"><span class="hrt">♥</span><span class="pill">Hay más
        aquí</span></button>
    <aside class="pop" id="pop" aria-labelledby="popTitle">
      <button class="x" id="popX" aria-label="Cerrar">×</button>
      <h2 class="ph" id="popTitle">Tu ramo</h2>
      <div class="bq" id="bq" aria-hidden="true"></div>
      <p id="popText"></p>
    </aside>
  </main>

  <!-- ============ SOBRE ============ -->
  <section id="intro" aria-label="Presentación de la carta">
    <div id="introFx" aria-hidden="true"></div>
    <div class="intro-inner">
      <button class="env-wrap" id="envWrap" type="button" aria-label="Abrir la carta" aria-controls="scene" aria-expanded="false">
        <span class="env-glow" aria-hidden="true"></span>
        <span class="env-bob">
          <span class="env" id="env" aria-hidden="true">
            <span class="back"></span>
            <span class="paper-in"></span>
            <span class="front"></span>
            <span class="env-to" id="envTo"></span>
            <span class="stamp">♥</span>
            <span class="flap"></span>
            <span class="seal" id="seal">
              <span class="half l"></span>
              <span class="half r"></span>
            </span>
          </span>
        </span>
      </button>
      <p id="hint" aria-hidden="true">Toca para abrir</p>
    </div>
  </section>
  <div id="bloom" aria-hidden="true"></div>
  <div id="top" aria-hidden="true"></div>
  <script src="java.js"></script>
</body>
</html>
