<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Wings Theme - BetterDiscord</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap">
  <style>
    body {
      margin: 0;
      background-color: #121212;
      font-family: 'Orbitron', sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .header {
      margin-top: 20px;
      font-size: 2em;
      color: #bb86fc;
    }

    .image-container {
      margin: 40px 0;
    }

    .image-container img {
      max-width: 90vw;
      max-height: 60vh;
      border-radius: 20px;
      box-shadow: 0 0 25px #bb86fc44;
    }

    .description {
      max-width: 600px;
      margin-bottom: 30px;
      font-size: 1.1em;
      color: #cdaef3;
    }

    .download-button {
      display: inline-block;
      padding: 15px 30px;
      background-color: #bb86fc;
      color: #121212;
      font-weight: bold;
      text-decoration: none;
      border-radius: 10px;
      transition: background-color 0.3s;
    }

    .download-button:hover {
      background-color: #cdaef3;
    }

    footer {
      margin-top: 50px;
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>
<body>
  <h1 class="header">Dark Wings Theme</h1>

  <div class="image-container">
    <img src="ba2f6a82615554114c74eabcabecce6e.jpg" alt="Dark Wings Theme Preview">
  </div>

  <div class="description">
    Un elegante tema oscuro con detalles brillantes inspirado en alas etéreas y misteriosas. Compatible con BetterDiscord.
  </div>

  <a class="download-button" href="DarkWings.theme.css" download>Descargar Tema</a>

  <footer>
    © 2025 · Creado por Ti
  </footer>
</body>
</html>
